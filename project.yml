name: MedFleet
options:
  bundleIdPrefix: net.medfleet
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  SWIFT_VERSION: "5.9"

targets:
  MedFleet:
    type: application
    platform: iOS
    sources:
      - path: MedFleet
        excludes:
          - Info.plist
        includes:
          - "**/*.swift"
          - "**/*.xcassets"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: net.medfleet.rep
      MARKETING_VERSION: "1.0.0"
      CURRENT_PROJECT_VERSION: 2
      INFOPLIST_FILE: MedFleet/Info.plist
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      DEVELOPMENT_TEAM: ""
      CODE_SIGN_STYLE: Automatic
      TARGETED_DEVICE_FAMILY: "1"
      SWIFT_EMIT_LOC_STRINGS: YES

# MedFleet iOS — Codemagic CI/CD
# Bundle ID: net.medfleet.rep

definitions:
  env_ios: &env_ios
    xcode: 16.4
    vars:
      XCODE_PROJECT: MedFleet.xcodeproj
      XCODE_SCHEME: MedFleet
      BUNDLE_ID: net.medfleet.rep

  scripts:
    xcodegen: &run_xcodegen
      name: Generate Xcode project
      script: |
        set -e
        brew install xcodegen
        xcodegen generate
        ls -la "$XCODE_PROJECT"

workflows:

  # ------------------------------------------------------------
  # 1) Simulator build
  # ------------------------------------------------------------
  ios-simulator:
    name: MedFleet — Simulator
    max_build_duration: 30
    instance_type: mac_mini_m2

    environment:
      <<: *env_ios

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - *run_xcodegen

      - name: Build for iOS Simulator
        script: |
          set -o pipefail

          xcodebuild build \
            -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee /tmp/xcbuild.log

          status=${PIPESTATUS[0]}

          echo "================ SWIFT ERRORS ================"
          grep -nE "error:" /tmp/xcbuild.log || echo "No Swift errors found"
          echo "=============================================="

          exit $status

    artifacts:
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - bassamabdulzahra1@gmail.com
        notify:
          success: true
          failure: true

  # ------------------------------------------------------------
  # 2) App Store / TestFlight IPA
  # ------------------------------------------------------------
  ios-ipa:
    name: MedFleet — IPA (App Store / TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: medfleet-apple

    environment:
      <<: *env_ios

      ios_signing:
        distribution_type: app_store
        bundle_identifier: net.medfleet.rep

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - *run_xcodegen

      - name: Configure code signing
        script: |
          set -e
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles --project "$CM_BUILD_DIR/$XCODE_PROJECT"
          echo "================ PROFILE ENTITLEMENTS ================"
          for p in "$HOME/Library/MobileDevice/Provisioning Profiles"/*.mobileprovision; do
            [ -f "$p" ] || continue
            echo "---- $(basename "$p") ----"
            security cms -D -i "$p" 2>/dev/null | plutil -extract Name raw -o - - 2>/dev/null || true
            security cms -D -i "$p" 2>/dev/null | plutil -extract Entitlements xml1 -o - - 2>/dev/null || true
          done
          echo "======================================================"

      - name: Set build number
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          agvtool new-version -all "$BUILD_NUMBER"

      - name: Verify signing identities
        script: |
          security find-identity -v -p codesigning

      - name: Build IPA
        script: |
          set -euo pipefail
          ARCHIVE_PATH="$CM_BUILD_DIR/build/ios/xcarchive/MedFleet.xcarchive"
          IPA_DIR="$CM_BUILD_DIR/build/ios/ipa"
          mkdir -p "$(dirname "$ARCHIVE_PATH")" "$IPA_DIR"

          EXPORT_PLIST=""
          for candidate in /Users/builder/export_options.plist "$HOME/export_options.plist" "$CM_BUILD_DIR/export_options.plist"; do
            if [ -f "$candidate" ]; then
              EXPORT_PLIST="$candidate"
              break
            fi
          done
          if [ -z "$EXPORT_PLIST" ]; then
            echo "export_options.plist not found after use-profiles"
            exit 1
          fi
          echo "Using export options: $EXPORT_PLIST"
          cat "$EXPORT_PLIST"

          # Do not pass CODE_SIGN_STYLE / profile flags here — xcode-project build-ipa
          # applies them to Firebase SPM targets and the archive fails.
          set +e
          xcodebuild archive \
            -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ENABLE_PREVIEWS=NO \
            2>&1 | tee /tmp/xcarchive.log
          status=${PIPESTATUS[0]}
          set -e

          if [ "$status" -ne 0 ]; then
            echo "================ ARCHIVE ERRORS ================"
            grep -niE "error:|❌|fatal error|CodeSign|Provisioning|entitlement" /tmp/xcarchive.log | tail -150 || true
            echo "================ BEFORE ARCHIVE FAILED ================"
            grep -nB 30 "ARCHIVE FAILED" /tmp/xcarchive.log | tail -80 || true
            echo "================ LAST 80 LINES ================"
            tail -80 /tmp/xcarchive.log || true
            echo "================================================"
            exit "$status"
          fi

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist "$EXPORT_PLIST" \
            -exportPath "$IPA_DIR" \
            2>&1 | tee /tmp/xcexport.log
          ls -la "$IPA_DIR"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - bassamabdulzahra1@gmail.com
        notify:
          success: true
          failure: true

      app_store_connect:
        auth: integration
        submit_to_testflight: true

# MedFleet iOS — Codemagic CI/CD
# Bundle ID: net.medfleet.rep

definitions:
  env_ios: &env_ios
    xcode: 16.4
    vars:
      XCODE_PROJECT: MedFleet.xcodeproj
      XCODE_SCHEME: MedFleet
      BUNDLE_ID: net.medfleet.rep

  scripts:
    xcodegen: &run_xcodegen
      name: Generate Xcode project
      script: |
        set -e

        brew install xcodegen
        xcodegen generate

        echo "================ PROJECT ================"
        ls -la "$XCODE_PROJECT"
        echo "========================================="

workflows:

  # ============================================================
  # 1) Simulator Build
  # ============================================================
  ios-simulator:
    name: MedFleet — Simulator
    max_build_duration: 30
    instance_type: mac_mini_m2

    environment:
      <<: *env_ios

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - *run_xcodegen

      - name: Build for iOS Simulator
        script: |
          set -o pipefail

          xcodebuild build \
            -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ENABLE_PREVIEWS=NO \
            2>&1 | tee /tmp/xcbuild.log

          status=${PIPESTATUS[0]}

          if [ "$status" -ne 0 ]; then
            echo "================ BUILD ERRORS ================"
            grep -niE "error:|fatal error|BUILD FAILED" /tmp/xcbuild.log | tail -100 || true
            echo "=============================================="
          fi

          exit "$status"

    artifacts:
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - bassamabdulzahra1@gmail.com
        notify:
          success: true
          failure: true

  # ============================================================
  # 2) App Store / TestFlight IPA
  # ============================================================
  ios-ipa:
    name: MedFleet — IPA (App Store / TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: medfleet-apple

    environment:
      <<: *env_ios

      ios_signing:
        distribution_type: app_store
        bundle_identifier: net.medfleet.rep

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - *run_xcodegen

      - name: Configure code signing
        script: |
          set -e

          echo "Initializing keychain..."
          keychain initialize

          echo "Adding Apple Distribution certificate..."
          keychain add-certificates

          echo "Applying Codemagic provisioning profiles..."
          xcode-project use-profiles \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT"

          echo "================ SIGNING IDENTITIES ================"
          security find-identity -v -p codesigning || true
          echo "===================================================="

      - name: Set build number
        script: |
          set -e

          cd "$CM_BUILD_DIR"

          echo "Setting build number to $BUILD_NUMBER"
          agvtool new-version -all "$BUILD_NUMBER"

      - name: Lock Manual signing
        script: |
          set -e

          echo "Locking Manual signing + App Store profile..."
          python3 "$CM_BUILD_DIR/tools/codemagic_prepare_signing.py" \
            "$CM_BUILD_DIR/$XCODE_PROJECT" \
            "$CM_BUILD_DIR/configs/export_options.plist"

      - name: Verify signing settings
        script: |
          set -e

          echo "================ TARGET SIGNING SETTINGS ================"

          xcodebuild \
            -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -showBuildSettings \
            | grep -E \
            "PRODUCT_BUNDLE_IDENTIFIER|DEVELOPMENT_TEAM|CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|PROVISIONING_PROFILE|PROVISIONING_PROFILE_SPECIFIER" \
            || true

          echo "========================================================="

      - name: Archive MedFleet
        script: |
          set -euo pipefail

          ARCHIVE_PATH="$CM_BUILD_DIR/build/ios/xcarchive/MedFleet.xcarchive"

          mkdir -p "$(dirname "$ARCHIVE_PATH")"

          echo "Archiving MedFleet..."

          echo "App profile (target only): $(cat /tmp/cm_profile_name.txt)"

          set +e

          xcodebuild archive \
            -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ENABLE_PREVIEWS=NO \
            2>&1 | tee /tmp/xcarchive.log

          status=${PIPESTATUS[0]}

          set -e

          if [ "$status" -ne 0 ]; then
            python3 "$CM_BUILD_DIR/tools/print_xcode_errors.py" /tmp/xcarchive.log
            echo "================ LAST 40 LINES ================"
            tail -40 /tmp/xcarchive.log || true
            echo "================================================"
            exit "$status"
          fi

          echo "Archive created successfully:"
          ls -la "$ARCHIVE_PATH"

      - name: Export IPA
        script: |
          set -euo pipefail

          ARCHIVE_PATH="$CM_BUILD_DIR/build/ios/xcarchive/MedFleet.xcarchive"
          IPA_DIR="$CM_BUILD_DIR/build/ios/ipa"
          EXPORT_PLIST="$CM_BUILD_DIR/export_options.plist"

          mkdir -p "$IPA_DIR"
          cp "$CM_BUILD_DIR/configs/export_options.plist" "$EXPORT_PLIST"

          echo "================ EXPORT OPTIONS ================"
          cat "$EXPORT_PLIST"
          echo "================================================"

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist "$EXPORT_PLIST" \
            -exportPath "$IPA_DIR" \
            2>&1 | tee /tmp/xcexport.log

          echo "================ IPA FILES ================"
          ls -lah "$IPA_DIR"
          echo "==========================================="

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/xcarchive/*.xcarchive
      - /tmp/xcodebuild_logs/*.log
      - /tmp/xcarchive.log
      - /tmp/xcexport.log

    publishing:
      email:
        recipients:
          - bassamabdulzahra1@gmail.com
        notify:
          success: true
          failure: true

      app_store_connect:
        auth: integration
        submit_to_testflight: true

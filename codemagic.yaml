# MedFleet iOS — Codemagic CI/CD
# Bundle ID: net.medfleet.rep

definitions:
  env_ios: &env_ios
    xcode: latest
    vars:
      XCODE_PROJECT: MedFleet.xcodeproj
      XCODE_SCHEME: MedFleet
      BUNDLE_ID: net.medfleet.rep

  scripts:
    xcodegen: &run_xcodegen
      name: Generate Xcode project
      script: |
        set -e
        brew install xcodegen
        xcodegen generate
        ls -la "$XCODE_PROJECT"

workflows:

  # ------------------------------------------------------------
  # 1) Simulator build
  # ------------------------------------------------------------
  ios-simulator:
    name: MedFleet — Simulator
    max_build_duration: 30
    instance_type: mac_mini_m2

    environment:
      <<: *env_ios

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - *run_xcodegen

      - name: Build for iOS Simulator
        script: |
          set -o pipefail

          xcodebuild build \
            -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee /tmp/xcbuild.log

          status=${PIPESTATUS[0]}

          echo "================ SWIFT ERRORS ================"
          grep -nE "error:" /tmp/xcbuild.log || echo "No Swift errors found"
          echo "=============================================="

          exit $status

    artifacts:
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - bassamabdulzahra1@gmail.com
        notify:
          success: true
          failure: true

  # ------------------------------------------------------------
  # 2) App Store / TestFlight IPA
  # ------------------------------------------------------------
  ios-ipa:
    name: MedFleet — IPA (App Store / TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: medfleet-apple

    environment:
      <<: *env_ios

      ios_signing:
        distribution_type: app_store
        bundle_identifier: net.medfleet.rep

    scripts:
      - *run_xcodegen

      - name: Configure code signing
        script: |
          set -e
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles

      - name: Set build number
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          agvtool new-version -all "$BUILD_NUMBER"

      - name: Verify signing identities
        script: |
          security find-identity -v -p codesigning

      - name: Build IPA
        script: |
          set -e

          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - bassamabdulzahra1@gmail.com
        notify:
          success: true
          failure: true

      app_store_connect:
        auth: integration
        submit_to_testflight: true
